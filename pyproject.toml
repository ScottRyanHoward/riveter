[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "riveter"
version = "0.2.4"
description = "Infrastructure Rule Enforcement as Code — validate Terraform against YAML rules"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Scott Howard", email = "scott@example.com" }]
keywords = ["terraform", "infrastructure", "security", "compliance", "iac"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "pyyaml>=6.0,<7.0",
    "click>=8.0,<9.0",
    "rich>=13.0,<15.0",
    "python-hcl2>=4.0,<5.0",
]

[project.optional-dependencies]
ai = [
    "anthropic>=0.25.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=24.0",
    "isort>=5.13",
    "mypy>=1.13",
    "ruff>=0.8.0",
    "types-PyYAML>=6.0",
    "bandit>=1.7.10",
    "pre-commit>=3.0.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
riveter = "riveter.cli:main"

[project.urls]
Homepage = "https://github.com/ScottRyanHoward/riveter"
Repository = "https://github.com/ScottRyanHoward/riveter"
"Bug Tracker" = "https://github.com/ScottRyanHoward/riveter/issues"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["src/riveter"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["E501"]  # line length handled by black

[tool.mypy]
strict = true
ignore_missing_imports = false
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "hcl2"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "anthropic"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "riveter.cli"
# Click decorators generate misc errors under strict mode
disable_error_code = ["misc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--cov=src/riveter",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
    "--cov-fail-under=60",
]
markers = [
    "unit: fast unit tests",
    "integration: tests requiring file system or external tools",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src/riveter"]
omit = ["*/tests/*", "*/__pycache__/*"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"
