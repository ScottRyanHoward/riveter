name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Check formatting (black)
        run: black --check src/ tests/

      - name: Check import order (isort)
        run: isort --check-only src/ tests/

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type check (mypy)
        run: mypy src/riveter/

      - name: Security scan (bandit)
        run: bandit -r src/riveter/ -ll

      - name: Run tests
        run: pytest

  validate-rule-packs:
    name: Validate rule packs
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Validate all rule packs load cleanly
        run: |
          python - <<'EOF'
          from riveter.rule_packs import RulePackManager
          mgr = RulePackManager()
          packs = mgr.list_available_packs()
          errors = [p for p in packs if p["rule_count"] == 0 and "failed" in str(p["description"])]
          if errors:
              for e in errors:
                  print(f"FAILED: {e['name']} — {e['description']}")
              raise SystemExit(1)
          print(f"OK: {len(packs)} rule packs loaded, "
                f"{sum(p['rule_count'] for p in packs)} rules total")
          EOF

  audit-deps:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Audit dependencies (pip-audit)
        run: pip-audit --ignore-vuln CVE-2026-3219

  binary-smoke:
    name: Binary smoke test
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,ai]"

      - name: Build binary
        run: python build_binary.py

      - name: Smoke test binary
        run: |
          ./dist/riveter --version
          ./dist/riveter --help
